<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI社員 バーチャルオフィス</title>
<style>
  :root {
    --blue: #4c8dff;
    --blue-bg: #eaf1ff;
    --green: #34b57a;
    --green-bg: #e8f9f0;
    --orange: #ff9f43;
    --orange-bg: #fff3e5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 16px 60px;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #fdf6ff 0%, #eef5ff 50%, #f0fff8 100%);
    color: #333;
    min-height: 100vh;
  }

  header {
    text-align: center;
    margin-bottom: 20px;
  }

  header h1 {
    font-size: 1.8rem;
    margin: 0 0 6px;
  }

  header p {
    margin: 0;
    color: #777;
    font-size: 0.9rem;
  }

  .summary {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .summary span {
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }

  /* ===== バーチャルオフィス ===== */
  .office {
    max-width: 1040px;
    margin: 0 auto;
    position: relative;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,0.6), transparent 40%),
      repeating-linear-gradient(90deg, #f4ead9 0px, #f4ead9 38px, #eee0ca 38px, #eee0ca 40px),
      repeating-linear-gradient(0deg, #f4ead9 0px, #f4ead9 38px, #eee0ca 38px, #eee0ca 40px);
    background-blend-mode: normal;
    border-radius: 24px;
    padding: 28px 22px 34px;
    box-shadow: inset 0 0 0 10px #fffdf8, 0 10px 30px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .office-decor {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
    padding: 0 6px;
  }

  .decor-item {
    font-size: 1.8rem;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.08));
  }

  .clock {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #ddd;
    position: relative;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
  }

  .clock .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: 16px;
    background: #444;
    transform-origin: bottom center;
    transform: translate(-50%, -100%) rotate(0deg);
    animation: tick 60s linear infinite;
    border-radius: 2px;
  }

  @keyframes tick {
    100% { transform: translate(-50%, -100%) rotate(360deg); }
  }

  .desks {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 26px 20px;
    position: relative;
    z-index: 1;
  }

  .desk {
    background: #ffffffee;
    border-radius: 18px;
    padding: 18px 14px 14px;
    text-align: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    border: 1px solid rgba(0,0,0,0.04);
    position: relative;
    animation: deskBob 3.2s ease-in-out infinite;
  }

  @keyframes deskBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .avatar-stage {
    position: relative;
    height: 84px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-bottom: 6px;
  }

  .bubble {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 0.7rem;
    white-space: nowrap;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    opacity: 0;
    animation: bubbleFade 4s ease-in-out infinite;
  }

  @keyframes bubbleFade {
    0%, 100% { opacity: 0; transform: translateX(-50%) translateY(4px); }
    15%, 80% { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .aura {
    position: absolute;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
  }

  .status-稼働中 .aura { animation: pulse-blue 1.6s ease-out infinite; }
  .status-完了 .aura { animation: pulse-green 2.6s ease-out infinite; }
  .status-要確認 .aura { animation: pulse-orange 1.1s ease-out infinite; }

  @keyframes pulse-blue {
    0% { box-shadow: 0 0 0 0 rgba(76,141,255,0.45); }
    100% { box-shadow: 0 0 0 16px rgba(76,141,255,0); }
  }
  @keyframes pulse-green {
    0% { box-shadow: 0 0 0 0 rgba(52,181,122,0.4); }
    100% { box-shadow: 0 0 0 10px rgba(52,181,122,0); }
  }
  @keyframes pulse-orange {
    0% { box-shadow: 0 0 0 0 rgba(255,159,67,0.5); }
    100% { box-shadow: 0 0 0 16px rgba(255,159,67,0); }
  }

  .avatar {
    position: relative;
    font-size: 2.4rem;
    line-height: 1;
    z-index: 2;
    animation: avatarBob 1.8s ease-in-out infinite;
  }

  .status-稼働中 .avatar { animation: avatarSway 0.7s ease-in-out infinite; }
  .status-要確認 .avatar { animation: avatarWiggle 0.5s ease-in-out infinite; }

  @keyframes avatarBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes avatarSway {
    0%, 100% { transform: translateX(-3px) rotate(-3deg); }
    50% { transform: translateX(3px) rotate(3deg); }
  }
  @keyframes avatarWiggle {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  .desk-icon {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.6rem;
    z-index: 1;
    opacity: 0.9;
  }

  .badge {
    position: absolute;
    bottom: 16px;
    left: calc(50% + 16px);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 800;
    color: #fff;
    z-index: 3;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  }

  .status-稼働中 .badge { background: var(--blue); }
  .status-完了 .badge { background: var(--green); animation: popIn 0.5s ease; }
  .status-要確認 .badge { background: var(--orange); animation: blink 0.8s steps(1) infinite; }

  @keyframes popIn {
    0% { transform: scale(0); }
    70% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  @keyframes blink {
    50% { opacity: 0.25; }
  }

  .name {
    font-size: 0.92rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .status-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .status-稼働中 .status-label { color: var(--blue); background: var(--blue-bg); }
  .status-完了 .status-label { color: var(--green); background: var(--green-bg); }
  .status-要確認 .status-label { color: var(--orange); background: var(--orange-bg); }

  .lastrun {
    font-size: 0.72rem;
    color: #999;
  }

  footer {
    text-align: center;
    margin-top: 30px;
    color: #aaa;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <h1>🏢 AI社員 バーチャルオフィス</h1>
  <p>今日も元気に働いてます👇（デスクの様子をのぞいてみてください）</p>
</header>

<div class="summary" id="summary"></div>

<div class="office">
  <div class="office-decor">
    <span class="decor-item">🪟</span>
    <div class="clock"><div class="hand"></div></div>
    <span class="decor-item">🪴</span>
  </div>
  <div class="desks" id="desks"></div>
</div>

<footer>データを更新したいときは、このファイル内の skills 配列を編集してください</footer>

<script>
  // ここを編集すればオフィスの中身が更新されます
  const skills = [
    { name: "提案書ドラフト担当", status: "完了", lastRun: "2026-07-20 09:00" },
    { name: "請求書チェック担当", status: "稼働中", lastRun: "2026-07-20 10:15" },
    { name: "競合リサーチ担当", status: "要確認", lastRun: "2026-07-19 18:40" }
  ];

  const statusMeta = {
    "稼働中": {
      icon: "🔵",
      badge: "…",
      messages: ["作業中です…", "がんばってます！", "もうすぐ完了です"]
    },
    "完了": {
      icon: "✅",
      badge: "✓",
      messages: ["完了しました！", "お疲れさまでした", "次の仕事待ちです"]
    },
    "要確認": {
      icon: "🟠",
      badge: "!",
      messages: ["確認お願いします！", "ちょっと待って〜", "見てほしいです"]
    }
  };

  const desksEl = document.getElementById("desks");

  skills.forEach((skill, i) => {
    const meta = statusMeta[skill.status];
    const desk = document.createElement("div");
    desk.className = `desk status-${skill.status}`;
    desk.style.animationDelay = `${(i % 5) * 0.25}s`;

    desk.innerHTML = `
      <div class="avatar-stage">
        <div class="bubble" style="animation-delay:${(i % 4) * 0.9}s">${meta.messages[i % meta.messages.length]}</div>
        <div class="aura"></div>
        <div class="badge" style="animation-delay:${(i % 3) * 0.2}s">${meta.badge}</div>
        <span class="desk-icon">🖥️</span>
        <span class="avatar" style="animation-delay:${(i % 4) * 0.15}s">🧑‍💻</span>
      </div>
      <div class="name">${skill.name}</div>
      <div class="status-label">${meta.icon} ${skill.status}</div>
      <div class="lastrun">🕒 最終実行: ${skill.lastRun}</div>
    `;
    desksEl.appendChild(desk);
  });

  const summaryEl = document.getElementById("summary");
  const counts = skills.reduce((acc, s) => {
    acc[s.status] = (acc[s.status] || 0) + 1;
    return acc;
  }, {});
  Object.entries(counts).forEach(([status, count]) => {
    const span = document.createElement("span");
    span.textContent = `${statusMeta[status].icon} ${status} ${count}件`;
    summaryEl.appendChild(span);
  });
</script>

</body>
</html>
