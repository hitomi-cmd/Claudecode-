<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI社員 稼働状況ダッシュボード</title>
<style>
  :root {
    --blue: #4c8dff;
    --blue-bg: #eaf1ff;
    --green: #34b57a;
    --green-bg: #e8f9f0;
    --orange: #ff9f43;
    --orange-bg: #fff3e5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px 60px;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #fdf6ff 0%, #eef5ff 50%, #f0fff8 100%);
    color: #333;
    min-height: 100vh;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  header h1 {
    font-size: 1.9rem;
    margin: 0 0 8px;
  }

  header p {
    margin: 0;
    color: #777;
    font-size: 0.95rem;
  }

  .summary {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  .summary span {
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .card {
    background: #fff;
    border-radius: 18px;
    padding: 20px 22px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.07);
    border: 1px solid rgba(0,0,0,0.04);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    overflow: hidden;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.12);
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 6px;
    height: 100%;
  }

  .card.status-稼働中::before { background: var(--blue); }
  .card.status-完了::before { background: var(--green); }
  .card.status-要確認::before { background: var(--orange); }

  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .card-icon {
    font-size: 1.6rem;
  }

  .card-name {
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.3;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 14px;
  }

  .badge.status-稼働中 { color: var(--blue); background: var(--blue-bg); }
  .badge.status-完了 { color: var(--green); background: var(--green-bg); }
  .badge.status-要確認 { color: var(--orange); background: var(--orange-bg); }

  .last-run {
    font-size: 0.85rem;
    color: #888;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    color: #aaa;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <h1>🤖 AI社員 稼働状況ダッシュボード</h1>
  <p>今日も元気に働いてます👇</p>
</header>

<div class="summary" id="summary"></div>

<div class="grid" id="grid"></div>

<footer>最終更新はデータを手動で編集してください（このファイル内の skills 配列）</footer>

<script>
  // ここを編集すればダッシュボードの内容が更新されます
  const skills = [
    { name: "提案書ドラフト担当", status: "完了", lastRun: "2026-07-20 09:00" },
    { name: "請求書チェック担当", status: "稼働中", lastRun: "2026-07-20 10:15" },
    { name: "競合リサーチ担当", status: "要確認", lastRun: "2026-07-19 18:40" }
  ];

  const statusIcon = {
    "稼働中": "🔵",
    "完了": "✅",
    "要確認": "🟠"
  };

  const grid = document.getElementById("grid");
  skills.forEach(skill => {
    const card = document.createElement("div");
    card.className = `card status-${skill.status}`;
    card.innerHTML = `
      <div class="card-top">
        <span class="card-icon">🧑‍💻</span>
        <span class="card-name">${skill.name}</span>
      </div>
      <div class="badge status-${skill.status}">${statusIcon[skill.status]} ${skill.status}</div>
      <div class="last-run">🕒 最終実行: ${skill.lastRun}</div>
    `;
    grid.appendChild(card);
  });

  const summary = document.getElementById("summary");
  const counts = skills.reduce((acc, s) => {
    acc[s.status] = (acc[s.status] || 0) + 1;
    return acc;
  }, {});
  Object.entries(counts).forEach(([status, count]) => {
    const span = document.createElement("span");
    span.textContent = `${statusIcon[status]} ${status} ${count}件`;
    summary.appendChild(span);
  });
</script>

</body>
</html>
